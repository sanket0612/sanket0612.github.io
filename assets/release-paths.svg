<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" role="img" aria-labelledby="title desc">
  <title id="title">Controlled releases</title><desc id="desc">A deployment path moves through build, checkpoint, Auto Scaling Group rollout, and observation.</desc>
  <defs><filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#806235" flood-opacity=".10"/></filter><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#a67c3f"/></marker></defs>
  <rect x="35" y="35" width="630" height="370" rx="20" fill="#fff" stroke="#e0d0b4" filter="url(#shadow)"/>
  <circle cx="68" cy="70" r="6" fill="#ae813d"/><text x="86" y="75" fill="#8c795d" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">RELEASE PATH</text>
  <text x="67" y="127" fill="#3d3b35" font-family="Arial,sans-serif" font-size="24" font-weight="700">Controlled changes, visible state</text>
  <path d="M183 236H209M334 236H360M485 236H511" stroke="#a67c3f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="63" y="192" width="120" height="89" rx="11" fill="#fbf7ef" stroke="#ddcaa7"/><circle cx="88" cy="222" r="12" fill="#efdbb8"/><path d="m83 222 4 4 7-9" fill="none" stroke="#9a6c2e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="79" y="260" fill="#55432b" font-family="Arial,sans-serif" font-size="16" font-weight="700">Build</text>
  <rect x="214" y="192" width="120" height="89" rx="11" fill="#fbf7ef" stroke="#ddcaa7"/><circle cx="239" cy="222" r="12" fill="#efdbb8"/><path d="M239 215v14m-7-7h14" stroke="#9a6c2e" stroke-width="2.5" stroke-linecap="round"/><text x="226" y="260" fill="#55432b" font-family="Arial,sans-serif" font-size="14" font-weight="700">Checkpoint</text>
  <rect x="365" y="192" width="120" height="89" rx="11" fill="#fbf7ef" stroke="#ddcaa7"/><circle cx="390" cy="222" r="12" fill="#efdbb8"/><path d="M383 226h14m-14-7h14" stroke="#9a6c2e" stroke-width="2.5" stroke-linecap="round"/><text x="378" y="260" fill="#55432b" font-family="Arial,sans-serif" font-size="15" font-weight="700">ASG rollout</text>
  <rect x="516" y="192" width="120" height="89" rx="11" fill="#fbf7ef" stroke="#ddcaa7"/><circle cx="541" cy="222" r="12" fill="#efdbb8"/><path d="M535 224h4l3-6 4 9 3-4h5" fill="none" stroke="#9a6c2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="532" y="260" fill="#55432b" font-family="Arial,sans-serif" font-size="16" font-weight="700">Observe</text>
  <text x="67" y="333" fill="#8b765a" font-family="Arial,sans-serif" font-size="12" font-weight="700">GRADUAL ROLLOUT</text><rect x="67" y="348" width="568" height="13" rx="6.5" fill="#f1e7d6"/><rect x="67" y="348" width="385" height="13" rx="6.5" fill="#b98c4a"/>

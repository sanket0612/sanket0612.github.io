<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" role="img" aria-labelledby="title desc">
  <title id="title">Composable environments</title><desc id="desc">Sandbox context travels through a Kafka producer, transactional outbox, and consumer toward an isolated test environment.</desc>
  <defs><filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#31527f" flood-opacity=".10"/></filter><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#507ebc"/></marker></defs>
  <rect x="27" y="35" width="646" height="370" rx="20" fill="#ffffff" stroke="#cbd9eb" filter="url(#shadow)"/>
  <circle cx="59" cy="70" r="6" fill="#4274bc"/><text x="78" y="75" fill="#657c99" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">COMPOSABLE ENVIRONMENT</text>
  <rect x="60" y="106" width="580" height="232" rx="15" fill="#f5f8fd" stroke="#dce6f2"/>
  <rect x="78" y="125" width="214" height="30" rx="15" fill="#e1ebfa"/><circle cx="96" cy="140" r="5" fill="#396cb4"/><text x="110" y="145" fill="#315888" font-family="Arial,sans-serif" font-size="12" font-weight="700">sandbox context travels with message</text>
  <path d="M212 236H268M433 236H487" stroke="#507ebc" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="79" y="189" width="133" height="94" rx="12" fill="#fff" stroke="#bad0e9"/><rect x="96" y="208" width="26" height="26" rx="6" fill="#dce9fa"/><path d="m104 221 5 5 7-10" fill="none" stroke="#3c70b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="260" fill="#253b58" font-family="Arial,sans-serif" font-size="16" font-weight="700">Producer</text>
  <rect x="284" y="189" width="149" height="94" rx="12" fill="#fff" stroke="#bad0e9"/><rect x="300" y="207" width="28" height="29" rx="5" fill="#dce9fa"/><path d="M306 216h16M306 222h16M306 228h10" stroke="#3c70b5" stroke-width="2" stroke-linecap="round"/><text x="300" y="260" fill="#253b58" font-family="Arial,sans-serif" font-size="16" font-weight="700">Outbox</text>
  <rect x="503" y="189" width="117" height="94" rx="12" fill="#fff" stroke="#bad0e9"/><circle cx="522" cy="222" r="13" fill="#dce9fa"/><path d="m518 222 4 4 7-9" fill="none" stroke="#3c70b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="519" y="260" fill="#253b58" font-family="Arial,sans-serif" font-size="16" font-weight="700">Consumer</text>
  <path d="M562 283v21" stroke="#507ebc" stroke-width="2.5" marker-end="url(#arrow)"/><text x="78" y="319" fill="#657c99" font-family="Arial,sans-serif" font-size="12">ISOLATED TEST ENVIRONMENT</text>
  <text x="60" y="377" fill="#617995" font-family="Arial,sans-serif" font-size="12">Context is preserved across asynchronous boundaries</text>
</svg>
